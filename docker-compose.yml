version: '3.8'

services:
  # Servizio principale per lo scraping
  scraper:
    build: .
    container_name: albo-scraper
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=0
      - DISPLAY=:99  # Per headless display se necessario
    networks:
      - albo-network
    restart: unless-stopped
    # Risorse ottimizzate per scraping intensivo
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; print('Scraper service healthy')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Servizio dedicato per l'analisi
  analysis:
    build: .
    container_name: albo-analysis
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
    command: ["python", "run.py", "enterprise", "sperone", "--workflow", "full"]
    networks:
      - albo-network
    restart: "no"
    depends_on:
      - scraper

  # Dashboard Control Room (Streamlit)
  control-room:
    build: .
    container_name: control-room
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_HEADLESS=true
    command: ["streamlit", "run", "src/delibere_comunali/cli/app_control_room.py", "--server.port", "8501", "--server.headless", "true"]
    networks:
      - albo-network
    depends_on:
      - scraper
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # RAG Application
  rag-app:
    build: .
    container_name: rag-app
    ports:
      - "8504:8504"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_PORT=8504
      - STREAMLIT_SERVER_HEADLESS=true
    command: ["streamlit", "run", "delibere_comunali/rag/rag_app.py", "--server.port", "8504", "--server.headless", "true"]
    networks:
      - albo-network
    depends_on:
      - scraper
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8504/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Web Dashboard
  web-dashboard:
    build: .
    container_name: web-dashboard
    ports:
      - "8503:8503"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_PORT=8503
      - STREAMLIT_SERVER_HEADLESS=true
    command: ["streamlit", "run", "src/delibere_comunali/web/dashboard.py", "--server.port", "8503", "--server.headless", "true"]
    networks:
      - albo-network
    depends_on:
      - scraper
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8503/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  albo-network:
    driver: bridge

volumes:
  data-volume:
  logs-volume:
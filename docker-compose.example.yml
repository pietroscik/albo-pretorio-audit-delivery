# Esempio di configurazioni Docker Compose per diversi scenari

# Scenario 1: Solo scraping (nessun dashboard)
version: '3.8'
services:
  scraper-only:
    build: .
    container_name: albo-scraper-only
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
    command: ["python", "-m", "src.delibere_comunali.scraping.new_albo_scraper", "--ente", "sperone", "--max-pages", "10"]
    restart: "no"

---
# Scenario 2: Solo dashboard (per visualizzazione dati esistenti)
version: '3.8'
services:
  dashboards-only:
    build: .
    container_name: albo-dashboards
    ports:
      - "8501:8501"
      - "8504:8504"
      - "8503:8503"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
    command: ["sh", "-c", "sleep 5 && streamlit run src/delibere_comunali/cli/app_control_room.py --server.port 8501 --server.headless true & streamlit run delibere_comunali/rag/rag_app.py --server.port 8504 --server.headless true & streamlit run src/delibere_comunali/web/dashboard.py --server.port 8503 --server.headless true & tail -f /dev/null"]
    restart: unless-stopped

---
# Scenario 3: Produzione con limiti di risorsa
version: '3.8'
services:
  scraper-prod:
    build: .
    container_name: albo-scraper-prod
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os; import sys; print('Production scraper healthy')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  control-room-prod:
    build: .
    container_name: control-room-prod
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_HEADLESS=true
    command: ["streamlit", "run", "src/delibere_comunali/cli/app_control_room.py", "--server.port", "8501", "--server.headless", "true"]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
    restart: unless-stopped
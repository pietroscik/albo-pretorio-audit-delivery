name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.10]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install pip-tools and sync the environment to match the lock file exactly
        pip install pip-tools
        pip-sync requirements.lock

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test with pytest
      run: |
        python -m pytest tests/ -v

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to DockerHub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/albo-pretorio-audit:latest
          ${{ secrets.DOCKER_USERNAME }}/albo-pretorio-audit:${{ github.sha }}

    - name: Image digest
      run: echo ${{ steps.docker_build.outputs.digest }}

  docker-compose-test:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v7

    - name: Set up Docker
      uses: docker/setup-docker-action@v5

    - name: Test Docker Compose
      run: |
        docker-compose -f docker-compose.yml config
        # Avvia i servizi e attende che i container con healthcheck siano "healthy".
        # Questo sostituisce l'attesa fissa con `sleep 30`.
        docker-compose -f docker-compose.yml up --build -d --wait
        docker-compose -f docker-compose.yml ps
        docker-compose -f docker-compose.yml logs
        docker-compose -f docker-compose.yml down

  deploy-staging:
    runs-on: ubuntu-latest
    needs: docker-compose-test
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v7

    - name: Deploy to staging
      run: |
        # Deploy commands would go here
        echo "Deploying to staging environment..."
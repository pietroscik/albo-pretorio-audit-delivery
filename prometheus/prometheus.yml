global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'albo-audit-system'
    static_configs:
      - targets: ['audit-engine:8001', 'metrics-exporter:8001']
    scrape_interval: 5s
    scrape_timeout: 4s

  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 10s